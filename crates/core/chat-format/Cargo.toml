[package]
name = "chat-format"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[features]
# A temporary checkpoint directory with a small tokenizer, for dependents' tests.
test-model = []

[dependencies]
checkpoint = { path = "../checkpoint" }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
minijinja = { version = "=2.24.0", features = ["json", "fuel"] }
minijinja-contrib = { version = "=2.24.0", features = ["pycompat"] }
jsonschema = { version = "=0.56.0", default-features = false }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
