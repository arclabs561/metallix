[package]
name = "server"
default-run = "metallix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "metallix"
path = "src/main.rs"

[[bin]]
name = "mx"
path = "src/bin/mx.rs"

[features]
metal = ["qwen/metal", "deepseek/metal", "dep:engine", "dep:rand_chacha", "dep:rand_core"]
structured-output = ["dep:engine", "engine/structured-output"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
deepseek = { path = "../models/deepseek" }
qwen = { path = "../models/qwen" }
engine = { path = "../engine", optional = true }
rand_chacha = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }

[lints]
workspace = true
