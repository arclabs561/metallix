[package]
name = "server"
default-run = "metallix"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[[bin]]
name = "metallix"
path = "src/main.rs"

[[bin]]
name = "mx"
path = "src/bin/mx.rs"

[features]
metal = ["qwen/metal", "deepseek/metal", "dep:engine", "dep:rand_chacha", "dep:rand_core", "dep:tokenizers", "dep:minijinja", "dep:minijinja-contrib", "dep:httparse", "dep:jsonschema", "dep:rustix", "dep:mlx-rs", "dep:mlx-sys"]
structured-output = ["dep:engine", "engine/structured-output"]
# Chrome/Perfetto JSON timeline behind `--trace-out`.
timeline = ["dep:tracing-chrome"]

[dependencies]
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
deepseek = { path = "../models/deepseek" }
julia = { path = "../models/julia" }
qwen = { path = "../models/qwen" }
engine = { path = "../engine", optional = true }
rand_chacha = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"], optional = true }
minijinja = { version = "=2.24.0", features = ["json", "fuel"], optional = true }
minijinja-contrib = { version = "=2.24.0", features = ["pycompat"], optional = true }
httparse = { version = "=1.10.1", optional = true }
jsonschema = { version = "=0.56.0", default-features = false, optional = true }
rustix = { version = "=1.1.4", features = ["fs"], optional = true }
mlx-rs = { workspace = true, optional = true }
mlx-sys = { version = "=0.2.0", optional = true }
tracing.workspace = true
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "env-filter", "tracing-log", "ansi"] }
tracing-chrome = { version = "=0.7.2", optional = true }

[dev-dependencies]
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
