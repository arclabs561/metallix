[package]
name = "metallix-cli"
default-run = "mx"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[lib]
name = "metallix_cli"

[[bin]]
name = "metallix"
path = "src/main.rs"

[[bin]]
name = "mx"
path = "src/bin/mx.rs"

[features]
metal = ["dep:audio", "dep:qwen3-asr", "qwen3-asr/metal", "qwen/metal", "deepseek/metal", "dep:engine", "dep:rand_chacha", "dep:rand_core", "dep:httparse", "dep:jsonschema", "dep:rustix", "dep:mlx-rs", "dep:mlx-sys", "dep:gemma", "gemma/metal", "dep:qwen35", "qwen35/metal", "dep:signal-hook", "dep:flux2", "flux2/metal", "dep:png", "dep:url"]
structured-output = ["dep:engine", "engine/structured-output"]
# Chrome/Perfetto JSON timeline behind `--trace-out`.
timeline = ["dep:tracing-chrome"]

[dependencies]
audio = { path = "../../core/audio", optional = true }
qwen3-asr = { path = "../../models/qwen3-asr", optional = true }
thiserror.workspace = true
clap.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
deepseek = { path = "../../models/deepseek" }
julia = { path = "../../models/julia" }
gemma = { path = "../../models/gemma", optional = true }
qwen35 = { path = "../../models/qwen35", optional = true }
qwen = { path = "../../models/qwen" }
flux2 = { path = "../../models/flux2", optional = true }
chat-format = { path = "../../core/chat-format" }
engine = { path = "../../core/engine", optional = true }
rand_chacha = { workspace = true, optional = true }
rand_core = { workspace = true, optional = true }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }
url = { version = "=2.5.7", optional = true }
httparse = { version = "=1.10.1", optional = true }
jsonschema = { version = "=0.56.0", default-features = false, optional = true }
rustix = { version = "=1.1.4", features = ["fs", "process"], optional = true }
# Stops `mx serve` on SIGTERM/SIGINT with its telemetry written.
signal-hook = { version = "=0.4.4", default-features = false, features = ["iterator"], optional = true }
mlx-rs = { workspace = true, optional = true }
# PNG output for `mx image generate`.
png = { version = "=0.18.1", optional = true }
mlx-sys = { version = "=0.6.0", optional = true }
tracing.workspace = true
tracing-subscriber = { version = "=0.3.23", default-features = false, features = ["fmt", "std", "env-filter", "tracing-log", "ansi"] }
tracing-chrome = { version = "=0.7.2", optional = true }

[dev-dependencies]
chat-format = { path = "../../core/chat-format", features = ["test-model"] }
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[lints]
workspace = true
