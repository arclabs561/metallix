[package]
name = "engine"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
sha2.workspace = true
thiserror.workspace = true
llguidance = { version = "=1.8.0", default-features = false, optional = true }
jsonschema = { version = "=0.56.0", default-features = false, optional = true }
serde_json = { workspace = true, optional = true }

[dev-dependencies]
divan = "0.1"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[[bench]]
name = "block_manager"
harness = false

[features]
structured-output = ["dep:llguidance", "dep:jsonschema", "dep:serde_json"]

[lints]
workspace = true
