[package]
name = "deepseek"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
blockfloat = { path = "../../blockfloat" }
mlx-rs = { workspace = true, optional = true }
mlx-sys = { version = "=0.2.0", optional = true }
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true

[features]
metal = ["dep:mlx-rs", "dep:mlx-sys"]

[dev-dependencies]
divan = "0.1"
proptest = { version = "=1.11.0", default-features = false, features = ["std"] }

[[bench]]
name = "checkpoint_index"
harness = false

[[bench]]
name = "selection"
harness = false

[[bench]]
name = "owner_transaction"
harness = false

[[bench]]
name = "range_cache"
harness = false

[[bench]]
name = "moe_provider"
harness = false
# Loads real expert weights when present; keep it out of `cargo test --all-targets`.
test = false

[[bench]]
name = "engram_hash"
harness = false

[[bench]]
name = "final_head"
harness = false
# Allocates the real 1.3 GB head; keep it out of `cargo test --all-targets`.
test = false

[lints]
workspace = true
