[package]
name = "gemma"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish.workspace = true

[dependencies]
layers = { path = "../../metal/layers", optional = true }
mlx-rs = { workspace = true, optional = true }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tracing.workspace = true

[features]
metal = ["dep:mlx-rs", "layers/metal"]

[dev-dependencies]
# Same pins as the server, which owns tokenization and template rendering.
minijinja = { version = "=2.24.0", features = ["json", "fuel"] }
minijinja-contrib = { version = "=2.24.0", features = ["pycompat"] }
tokenizers = { version = "0.22.2", default-features = false, features = ["onig"] }

[lints]
workspace = true
