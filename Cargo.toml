[workspace]
members = [
    "crates/blockfloat",
    "crates/engine",
    "crates/models/deepseek",
    "crates/models/julia",
    "crates/models/qwen",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "=0.10.9"
mlx-rs = { version = "=0.32.0", default-features = false, features = ["metal", "safetensors"] }
rand_chacha = "=0.9.0"
rand_core = "=0.9.3"
tracing = "=0.1.44"

[workspace.lints.rust]
unsafe_code = "deny"
# Toolchains in use span Clippy 1.98 and 1.99; a lint configured for the newer
# one is unknown to the older one.
unknown_lints = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
# Clippy 1.99 pedantic lint; its `assert_eq!(x, [])` rewrite often needs type
# annotations and adds no checking over `assert!(x.is_empty())`.
assert_is_empty = "allow"
