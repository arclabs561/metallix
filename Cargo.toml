[workspace]
members = [
    "crates/engine",
    "crates/models/deepseek",
    "crates/models/qwen",
    "crates/server",
]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "=0.10.9"
mlx-rs = { version = "=0.25.3", default-features = false, features = ["metal", "safetensors"] }
rand_chacha = "=0.9.0"
rand_core = "=0.9.3"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
missing_errors_doc = "allow"
