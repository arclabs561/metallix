[workspace]
# The application defaults to mx; use --workspace for all crate targets.
default-members = ["crates/app/cli"]
members = [
    "crates/core/audio",
    "crates/core/blockfloat",
    "crates/core/chat-format",
    "crates/core/checkpoint",
    "crates/core/diffusion",
    "crates/core/engine",
    "crates/core/media",
    "crates/metal/layers",
    "crates/metal/mlx-kernels",
    "crates/models/deepseek",
    "crates/models/flux2",
    "crates/models/gemma",
    "crates/models/julia",
    "crates/models/qwen",
    "crates/models/qwen3-asr",
    "crates/models/qwen35",
    "crates/app/cli",
]
# Third-party code patched below; not held to this workspace's lints.
exclude = ["vendor/mlx-sys"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"
rust-version = "1.87"
publish = false

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
clap = { version = "4", features = ["derive"] }
sha2 = "=0.10.9"
mlx-rs = { version = "=0.32.0", default-features = false, features = ["metal", "safetensors"] }
libm = "=0.2.16"
rand_chacha = "=0.9.0"
rand_core = "=0.9.3"
tracing = "=0.1.44"

[workspace.lints.rust]
unsafe_code = "deny"
# Toolchains in use span Clippy 1.98 and 1.99; a lint configured for the newer
# one is unknown to the older one.
unknown_lints = "allow"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
module_name_repetitions = "allow"
# Clippy 1.99 pedantic lint; its `assert_eq!(x, [])` rewrite often needs type
# annotations and adds no checking over `assert!(x.is_empty())`.
assert_is_empty = "allow"

# mlx-sys 0.6.0 with a pinned macOS deployment target and a NAX query; see
# vendor/mlx-sys/VENDORED.md.
[patch.crates-io]
mlx-sys = { path = "vendor/mlx-sys" }
