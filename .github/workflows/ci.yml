name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust checks
    runs-on: macos-15
    timeout-minutes: 30
    steps:
      # Pin third-party actions to an immutable commit. Update deliberately.
      - name: Check out source
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false

      # Crates depend only on their own tier or a lower one (core <- metal
      # <- models <- app). Standard library only, so it needs no setup.
      - name: Check crate tiers
        run: python3 scripts/check_crate_tiers.py

      # mlx-sys builds MLX's Metal kernels from source and needs a newer Xcode
      # SDK than this image provides, so the default workspace must stay
      # featureless. Without this guard, a new unconditional dependency fails
      # inside MLX's own headers instead of naming the cause.
      # `cargo tree -i` exits nonzero when the package is absent, so invert it.
      - name: Keep MLX out of the default workspace
        run: '! cargo tree --workspace -e normal -i mlx-sys'

      - name: Verify formatting
        run: cargo fmt --check

      - name: Run workspace tests
        run: cargo test --workspace

      - name: Run strict Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Build documentation
        run: cargo doc --workspace --no-deps

      # The diagram check compares committed SVGs with a fresh rendering, so
      # CI uses the same pinned typst release as local renders.
      - name: Install typst
        env:
          TYPST_URL: https://github.com/typst/typst/releases/download/v0.15.1/typst-aarch64-apple-darwin.tar.xz
          TYPST_SHA256: 48f62ed034aa3a7978309579ac6ca00045e2ef0da73114e8af27cfd8e74dc05a
        run: |
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/typst.tar.xz" "$TYPST_URL"
          echo "$TYPST_SHA256  $RUNNER_TEMP/typst.tar.xz" | shasum -a 256 --check
          tar -xJf "$RUNNER_TEMP/typst.tar.xz" -C "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/typst-aarch64-apple-darwin" >> "$GITHUB_PATH"

      - name: Check architecture diagrams
        run: python3 scripts/check_arch_diagrams.py --require-typst
